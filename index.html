    *, *::before, *::after {

      letter-spacing: 0.5px;

    #main-content {
      position: fixed;
      top: 52px;
      bottom: 68px;
      left: 0;
      right: 0;
      background: #f4f6f8;
    }
    .iframe-box {
      position: absolute;
      inset: 0;
      display: none;
      background: #fff;
    }
    .iframe-box.active {
      display: block;
    }
    .iframe-box iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    /* Loading indicator leve */
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: #f8f9fb;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      transition: opacity 0.3s ease;
    }
    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e5e7eb;
      border-top-color: #4d0050;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ===== FOOTER MODERNO ===== */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 68px;
      background: #4d0050;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
      z-index: 20;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
    }
    .nav {
      display: flex;
      width: 100%;
      max-width: 480px;
      justify-content: space-between;
      gap: 4px;
    }
    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 8px 4px;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.65);
      font-size: 11px;
      font-weight: 500;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.22s ease;
      position: relative;
    }
    .nav-btn img {
      width: 24px;
      height: 24px;
      opacity: 0.75;
      transition: all 0.22s ease;
    }
    .nav-btn svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
      opacity: 0.75;
      transition: all 0.22s ease;
    }
    .nav-btn span {
      line-height: 1.1;
    }
    /* Estado ativo */
    .nav-btn.active {
      color: #fff;
      background: rgba(255,255,255,0.15);
    }
    .nav-btn.active img,
    .nav-btn.active svg {
      opacity: 1;
      transform: scale(1.08);
    }
    /* Indicador superior sutil */
    .nav-btn.active::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 28px;
      height: 3px;
      background: #fff;
      border-radius: 0 0 4px 4px;
    }
    .nav-btn:active {
      transform: scale(0.94);
    }

    @media (max-width: 380px) {
      .nav-btn {
        font-size: 10px;
      }
      .nav-btn img,
      .nav-btn svg {
        width: 22px;
        height: 22px;
      }
    }

  <script>
    // URLs das bancas
    const urls = {
      acertos: 'https://app.superbancas.club/pr/3IMRdWnG',
      aguia: 'https://app.superacertos.club/pr/BEKLAbfT',
      feiticeira: 'https://app.feiticeira.club/pr/2iCVbLKr'
    };

    // Títulos dos iframes (acessibilidade)
    const titles = {
      acertos: 'Super Bancas',
      aguia: 'Super Acertos',
      feiticeira: 'Feiticeira Vip'
    };

    // Cache de iframes já carregados (evita recarregar)
    const loaded = {};

    function createIframe(tab) {
      const box = document.getElementById('box-' + tab);
      if (!box || loaded[tab]) return;

      const iframe = document.createElement('iframe');
      iframe.src = urls[tab];
      iframe.title = titles[tab];
      iframe.allow = 'clipboard-read; clipboard-write';
      iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads allow-top-navigation-by-user-activation');
      iframe.loading = 'lazy';

      // Remove loading quando o iframe terminar de carregar
      iframe.onload = () => {
        const overlay = box.querySelector('.loading-overlay');
        if (overlay) overlay.classList.add('hidden');
      };

      box.appendChild(iframe);
      loaded[tab] = true;
    }

    function mostrar(tab) {
      // WhatsApp
      if (tab === 'suporte') {
        window.open('https://wa.me/5583993523067?text=Ol%C3%A1%2C%20Suporte.%20vim%20da%20feiticeira%20e%20Preciso%20de%20ajuda%21', '_blank');
        return;
      }

      // Ativa a box correta
      document.querySelectorAll('.iframe-box').forEach(box => {
        box.classList.remove('active');
      });
      const currentBox = document.getElementById('box-' + tab);
      if (currentBox) currentBox.classList.add('active');

      // Carrega o iframe só na primeira vez que a aba é aberta
      createIframe(tab);

      // Atualiza botões do footer
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });
    }

    // Carrega a aba inicial (Feiticeira)
    document.addEventListener('DOMContentLoaded', () => {
      createIframe('feiticeira');
    });
  </script>
